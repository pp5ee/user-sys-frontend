<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="团队任务台：看今天有哪些事、谁在做、做到哪了。" />
  <title>团队任务台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6f5c'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="titleblock">
        <p class="eyebrow" id="today">—</p>
        <h1>团队任务台</h1>
        <p class="sub" id="summary">看今天有哪些事、谁在做、做到哪了。</p>
      </div>
      <div class="topbar-actions">
        <button id="refresh" class="btn ghost" type="button" title="重新拉取任务">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 6.5A6.5 6.5 0 1 0 16.5 12" /><path d="M15.5 2.5v4h-4" /></svg>
          刷新
        </button>
        <button id="new-task" class="btn primary" type="button">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11" /></svg>
          新建任务
        </button>
      </div>
    </header>

    <section class="toolbar">
      <div class="tabs" role="group" aria-label="按状态筛选">
        <button class="tab" type="button" data-status="all" aria-pressed="true">全部<span class="tab-count" data-count="all">0</span></button>
        <button class="tab" type="button" data-status="todo" aria-pressed="false">待办<span class="tab-count" data-count="todo">0</span></button>
        <button class="tab" type="button" data-status="doing" aria-pressed="false">进行中<span class="tab-count" data-count="doing">0</span></button>
        <button class="tab" type="button" data-status="done" aria-pressed="false">完成<span class="tab-count" data-count="done">0</span></button>
      </div>
      <label class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5" /><path d="M13.2 13.2L17 17" /></svg>
        <input id="search" type="search" placeholder="搜标题或负责人" autocomplete="off" aria-label="搜标题或负责人" />
      </label>
    </section>

    <section class="board" aria-label="任务列表">
      <div class="list-head" aria-hidden="true">
        <span>任务</span>
        <span>负责人</span>
        <span>优先级</span>
        <span>状态</span>
      </div>
      <ul id="list" class="list"></ul>

      <div id="skeleton" class="skeleton" aria-hidden="true">
        <div class="sk-row"><span class="sk w60"></span><span class="sk w20"></span><span class="sk w30"></span><span class="sk w50"></span></div>
        <div class="sk-row"><span class="sk w40"></span><span class="sk w20"></span><span class="sk w30"></span><span class="sk w50"></span></div>
        <div class="sk-row"><span class="sk w50"></span><span class="sk w20"></span><span class="sk w30"></span><span class="sk w50"></span></div>
      </div>

      <div id="empty" class="empty" hidden>
        <div class="empty-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 6.5h9M4 12h9M4 17.5h5" /><path d="M17.5 12.5l2 2 3-3.5" /></svg>
        </div>
        <p class="empty-title">这里还没有任务</p>
        <p class="empty-sub">点右上角「新建任务」，把今天要做的事记下来。</p>
      </div>

      <div id="error" class="error" hidden>
        <p class="error-title">接口连不上</p>
        <p class="error-sub" id="error-sub">请检查后端服务是否在线。</p>
        <button id="retry" class="btn ghost" type="button">重试</button>
      </div>
    </section>

    <footer class="foot">
      <span class="dot-live" aria-hidden="true"></span>
      <span id="foot-text">正在连接接口…</span>
    </footer>
  </main>

  <dialog id="task-dialog" class="dialog">
    <form id="task-form" novalidate>
      <header class="dialog-head">
        <h2>新建任务</h2>
        <button type="button" class="icon-btn" id="dialog-close" aria-label="关闭">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" /></svg>
        </button>
      </header>

      <div class="field">
        <div class="field-head">
          <label for="f-title">标题</label>
          <span class="counter" id="title-counter">0/200</span>
        </div>
        <input id="f-title" name="title" type="text" maxlength="200" placeholder="例如：把登录页的联调做完" autocomplete="off" required />
        <p class="field-error" id="title-error" hidden></p>
      </div>

      <div class="field">
        <div class="field-head">
          <label for="f-assignee">负责人</label>
          <span class="counter" id="assignee-counter">0/50</span>
        </div>
        <input id="f-assignee" name="assignee" type="text" maxlength="50" placeholder="谁来负责" autocomplete="off" required />
        <p class="field-error" id="assignee-error" hidden></p>
      </div>

      <div class="field">
        <div class="field-head"><span class="label-like" id="priority-label">优先级</span></div>
        <div class="segmented" role="radiogroup" aria-labelledby="priority-label">
          <label class="seg"><input type="radio" name="priority" value="low" /><span>低</span></label>
          <label class="seg"><input type="radio" name="priority" value="medium" checked /><span>中</span></label>
          <label class="seg"><input type="radio" name="priority" value="high" /><span>高</span></label>
        </div>
      </div>

      <p class="dialog-hint">新任务会以「待办」状态创建，之后可以在列表里改状态。</p>

      <footer class="dialog-actions">
        <button type="button" class="btn ghost" id="dialog-cancel">取消</button>
        <button type="submit" class="btn primary" id="dialog-submit">新建任务</button>
      </footer>
    </form>
  </dialog>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <template id="row-template">
    <li class="row">
      <div class="cell cell-title">
        <p class="task-title"></p>
        <p class="task-meta"></p>
      </div>
      <div class="cell cell-assignee">
        <span class="avatar" aria-hidden="true"></span>
        <span class="assignee-name"></span>
      </div>
      <div class="cell cell-priority">
        <span class="badge priority"></span>
      </div>
      <div class="cell cell-status">
        <button class="chip status" type="button"><span class="status-dot" aria-hidden="true"></span><span class="status-label"></span></button>
        <button class="revert" type="button" title="退回上一步" aria-label="退回上一步">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5.5L3.5 9.5l4 4" /><path d="M3.5 9.5h7a5 5 0 0 1 0 10" /></svg>
        </button>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
